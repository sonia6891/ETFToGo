name: Probe Tuist Linux runner
on:
  push:
    branches: [ui/pocket-redesign]
    paths: [.github/workflows/tuist-linux-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: tuist-linux
    timeout-minutes: 5
    steps:
      - name: Report runner
        run: |
          uname -a
          echo "Tuist Linux runner picked up this job."
