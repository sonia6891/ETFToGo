name: App Store Connect name and TestFlight check
# Same API key as testflight.yml. Renames the app in App Store Connect and waits until the newest build is
# processed and available to the internal TestFlight testers.
on:
  workflow_dispatch:
    inputs:
      name:
        description: App name in App Store Connect (blank to skip renaming)
        required: false
        default: 投資袋著走
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ETF_BUNDLE_ID: ${{ vars.ETF_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the API key
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/etf-signing"
          python3 - <<'PY'
          import os, pathlib, re
          body = re.sub(r"-----[A-Z ]+-----|\s", "", os.environ["ASC_KEY_P8"].strip())
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i + 64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "etf-signing" / "AuthKey.p8").write_text(pem)
          PY
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet cryptography
      - name: Rename the app
        if: inputs.name != ''
        env:
          APP_NAME: ${{ inputs.name }}
        run: '"$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_app.py rename "$APP_NAME"'
      - name: Wait for the newest build and give it to internal testers
        run: '"$RUNNER_TEMP/asc-venv/bin/python" Scripts/asc_app.py testflight'
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/etf-signing"
