name: Preserve native UI screenshots
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed native-ui run in this repository
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ETFToGo-native-ui-evidence
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-evidence
      - name: Save screenshots and project to a separate private branch
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          git switch --orphan "ui-evidence-$RUN_ID"
          mkdir -p Screens Evidence
          cp "$RUNNER_TEMP/native-evidence/build/screens/"*.png Screens/
          cp -R "$RUNNER_TEMP/native-evidence/ETFToGo.xcodeproj" Evidence/
          cp "$RUNNER_TEMP/native-evidence/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png" Evidence/
          cp "$RUNNER_TEMP/native-evidence/build/compile.log" Evidence/
          cp "$RUNNER_TEMP/native-evidence/build/tests.log" Evidence/
          printf 'Native simulator screenshots from workflow run %s. Demo data. No TestFlight release.\n' "$RUN_ID" > Evidence/README.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Screens Evidence
          git commit -m "Preserve native UI evidence from run $RUN_ID"
          git push origin "ui-evidence-$RUN_ID"
