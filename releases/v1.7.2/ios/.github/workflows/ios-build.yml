name: Native iOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Core tests
        run: swift test
      - name: iPhone simulator build
        run: >-
          xcodebuild -project ETFToGo.xcodeproj -scheme ETFToGo
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: iPhone device compilation (unsigned)
        run: >-
          xcodebuild -project ETFToGo.xcodeproj -scheme ETFToGo
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --keepParent build/simulator/Build/Products/Debug-iphonesimulator/ETFToGo.app build/ETFToGo-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ETFToGo-Simulator-not-an-iPhone-installer
          path: build/ETFToGo-Simulator.zip
