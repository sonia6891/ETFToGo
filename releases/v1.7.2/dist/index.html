/* ETF ToGo · Brand v1.4: genuine standalone transparent asset, no cropped mockups */
.brandmark{display:grid;place-items:center;width:48px;height:48px;border:0;background:transparent;overflow:visible;border-radius:12px;flex-shrink:0}
.brandmark img{display:block;width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 4px #10397517)}
.brandname{letter-spacing:.3px}
.greeting h1{letter-spacing:-.5px}
.brand-feature{margin:18px 0;background:linear-gradient(115deg,#eef6ff,#f6fcff);border:1px solid #dbeaff;border-radius:18px;padding:16px}
.dark .brand-feature{background:#122848;border-color:#29496d}
.brand-feature h3{font-size:15px;margin:0 0 8px}
.brand-feature p{font-size:12px;line-height:1.65;color:var(--muted)}
.feature-badge{display:inline-block;border-radius:50px;font-size:10px;padding:4px 9px;background:#e1edfd;color:#185cd4;margin-bottom:10px}
.dark .feature-badge{background:#193b64;color:#abd3ff}
.feature-rows{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.feature-rows a{display:inline-flex;min-height:40px;padding:10px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--accent);font-size:12px;font-weight:700}
.constituent-list{margin-top:13px}
.constituent-row{display:grid;grid-template-columns:minmax(0,1fr) 68px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}
.constituent-row b{font-size:12px}
.constituent-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.constituent-row strong{text-align:right;font-size:14px;color:var(--ink)}
.constituent-row .progress{grid-column:1/-1;margin:0;height:5px}
.inline-danger{color:var(--warning);font-size:12px;padding:10px;background:var(--warnbg);border-radius:10px;margin-top:12px}
.info-box{padding:14px;background:var(--soft);border-radius:13px;color:var(--ink);font-size:12px;line-height:1.7;margin:12px 0}
.holding-view{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.holding-view .button{min-height:40px}
.broker-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}
.broker-tile{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-size:12px}
.broker-tile b{font-size:13px}.broker-tile small{display:block;color:var(--muted);margin-top:6px}

<input id="backup-input" type="file" accept=".json,application/json" hidden><noscript>請啟用 JavaScript 使用 ETF 袋著走的持有、配息與試算功能。</noscript><script type="module">const Finance=(()=>{

/** Pure calculation and validation functions. Rates are decimal fractions, not percentages. */
const DEFAULT_PLAN = Object.freeze({principal:100000, monthly:5000, years:10, totalReturn:0.06, distributionRate:0.04, frequency:4, reinvest:1, deductionRate:0});
const FREQ = new Set([1,2,4,12]);
function bounded(n, name, min, max, integer=false) {
  if (typeof n !== 'number' || !Number.isFinite(n) || n < min || n > max || (integer && !Number.isInteger(n))) throw new Error(`${name}須為${integer?'整數，且為':''}${min}～${max}之間的有效數值。`);
  return n;
}
function validatePlan(p) {
  if(!p || typeof p !== 'object') throw new Error('試算格式不正確。');
  bounded(p.principal,'初始本金',0,1e12); bounded(p.monthly,'每月投入',0,1e9);
  bounded(p.years,'年數',1,50,true); bounded(p.totalReturn,'年化總報酬率',-0.9,0.5);
  bounded(p.distributionRate,'年配息比例',0,0.3); bounded(p.reinvest,'再投入比例',0,1);
  bounded(p.deductionRate,'配息扣費比例',0,0.2);
  if(!FREQ.has(p.frequency)) throw new Error('配息頻率須為月、季、半年或年。');
  return p;
}
/** A total-return wealth process with cash distributions SUBTRACTED before reinvestment. */
function simulate(p) {
  validatePlan(p);
  const monthlyRate = Math.expm1(Math.log1p(p.totalReturn)/12);
  const interval=12/p.frequency;
  let invested=p.principal, cash=0, contributed=p.principal, distributions=0, reinvested=0, deductions=0;
  const rows=[{year:0,invested,cash,total:invested,contributed,distributions,reinvested,deductions,gain:0}];
  for(let month=1;month<=p.years*12;month++){
    invested *= 1+monthlyRate;
    if(month%interval===0){
      const gross = invested*p.distributionRate/p.frequency;
      const cost=gross*p.deductionRate;
      const net=gross-cost;
      invested -= gross;
      invested += net*p.reinvest;
      cash += net*(1-p.reinvest);
      distributions+=gross; reinvested+=net*p.reinvest; deductions+=cost;
    }
    invested+=p.monthly; contributed+=p.monthly;
    if(month%12===0) rows.push({year:month/12,invested,cash,total:invested+cash,contributed,distributions,reinvested,deductions,gain:invested+cash-contributed});
  }
  return {rows,final:rows[rows.length-1],monthlyRate};
}
function comparePlans(p){
  return [{key:'cash',label:'全部領出',ratio:0},{key:'selected',label:'你的設定',ratio:p.reinvest},{key:'all',label:'全部再投入',ratio:1}].map(s=>({...s,...simulate({...p,reinvest:s.ratio})}));
}
function incomeGoal(monthlyTarget, annualRate, deductionRate=0, current=0){
  bounded(monthlyTarget,'每月目標',0,1e8); bounded(annualRate,'配息率',0,.3); bounded(deductionRate,'扣費比例',0,.2); bounded(current,'目前本金',0,1e12);
  if(monthlyTarget===0)return {required:0,gap:0,netRate:annualRate*(1-deductionRate)};
  const netRate=annualRate*(1-deductionRate);
  if(netRate===0)return {required:null,gap:null,netRate};
  const required=monthlyTarget*12/netRate;
  return {required,gap:Math.max(0,required-current),netRate};
}
function isDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const d=new Date(value+'T12:00:00Z');
  return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value&&value>='1900-01-01'&&value<='2200-12-31';
}
function text(v,name,max=120,empty=false){if(typeof v!=='string'||(!empty&&!v.trim())||v.length>max)throw new Error(`${name}格式不正確。`);return v.trim();}
function validateHolding(h){
  if(!h||typeof h!=='object')throw new Error('持有資料格式不正確。');
  const id=text(h.id,'記錄編號',80),code=text(h.code,'代碼',20),name=text(h.name,'名稱',120);
  if(!/^[A-Za-z0-9.-]{1,20}$/.test(code))throw new Error('代碼僅限英文字母、數字、點或短橫線。');

rong><small>使用者輸入${x.priceDate?' · 參考價日期 '+esc(x.priceDate):''}</small></div><span class="badge">${money(x.shares)} 股</span></div><div class="statrow"><div><span>總成本</span><b>${money(x.cost)}</b></div><div><span>參考市值</span><b>${x.price===null?'待輸入':money(x.price*x.shares)}</b></div><div><span>未實現損益</span><b>${x.price===null?'待輸入':money(x.price*x.shares-x.cost)}</b></div></div><div class="toolbar" style="margin-top:14px"><button class="btn" data-action="edit-holding" data-id="${esc(x.id)}">編輯</button><button class="btn" data-action="record-dividend" data-id="${esc(x.id)}">記錄配息</button><button class="btn danger" data-action="delete-holding" data-id="${esc(x.id)}">刪除</button></div></article>`).join(''):'<div class="empty"><h3>還沒有持有記錄</h3><p>從一筆你自己確認的 ETF 持倉開始。</p></div>'}</section></div>`;

  const q=quotes.get(symbol),err=errors.get(symbol);

  if(!Number.isFinite(q.price)||q.price<=0)return `<div class="q-price">—</div><div class="q-caption">${esc(err||stateLabels[q.state]||'尚無成交價')}</div>`;
  const stale=offline||!!err||(q.state==='intraday'&&Date.now()-Date.parse(q.fetchedAt)>90000);
  const delta=Number.isFinite(q.change)&&Number.isFinite(q.changePercent)?`<div class="q-delta ${q.change>0?'positive':q.change<0?'negative':''}">${q.change>0?'▲ +':q.change<0?'▼ ':''}${fmt.format(q.change)} (${q.changePercent>0?'+':''}${fmt.format(q.changePercent)}%)</div>`:'';

 }

  try{const d=await request('/api/market/quotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbols:list})});clock=d.clock;errors.clear();for(const q of d.quotes||[])if(list.includes(q.symbol))quotes.set(q.symbol,q);for(const e of d.errors||[])errors.set(e.symbol,e.message||'無法取得行情');offline=false;wait=d.retryAfter?Math.max(60000,d.retryAfter*1000):clock?.pollSeconds*1000||20000;lastIssue='';}

 }

function importConstituentsFromDisk(){try{const x=JSON.parse(localStorage.getItem(ETF_HOLDING_CACHE_KEY)||'{}');if(!x||typeof x!=='object'||Array.isArray(x))return;for(const [code,data] of Object.entries(x)){if(!/^[0-9]{4,6}[A-Z]?$/.test(code))continue;if(data?.symbol!==code||!/^\d{4}-\d{2}-\d{2}$/.test(data.date)||!Array.isArray(data.components)||data.components.length>1000)continue;const clean=normalizeComponents(data.components);if(clean)constituentData.set(code,{...data,components:clean,source:'使用者匯入（未經本站核驗）'});}}catch{}}
function normalizeComponents(rows){if(!Array.isArray(rows)||!rows.length||rows.length>1000)return null;const seen=new Set(),out=[];let sum=0;for(const r of rows){const symbol=String(r.symbol||'').trim(),name=String(r.name||'').trim(),weight=Number(r.weight);if(!/^[A-Za-z0-9.\-]{1,15}$/.test(symbol)||seen.has(symbol)||!name||name.length>120||!Number.isFinite(weight)||weight<0||weight>100)return null;sum+=weight;seen.add(symbol);out.push({symbol,name,weight});}if(sum>110)return null;return out.sort((a,b)=>b.weight-a.weight);}

function list(){return `${title('找 ETF',false,`<a class="button smallbtn" href="#favorites">${icon('star')} 我的收藏</a>`)}<p class="page-intro">輸入代碼找特定 ETF，或依投資角色慢慢看。</p><label class="searchbox">${icon('search')}<input id="search" type="search" placeholder="搜尋代碼或名稱，例如 0050" aria-label="搜尋 ETF" value="${esc(query)}"></label><section class="filter-section" aria-labelledby="role-filter-title"><div class="filter-heading"><h2 id="role-filter-title">你想找哪一種？</h2><a class="text-link" href="#compare">ETF 比較 ${icon('arrow')}</a></div><div id="role-chips"></div><p class="filter-note">分類為規則初判。印鈔機僅列研究候選，尚未驗證穩定獲利；配息不等於獲利。</p></section><details class="strategy-filters" ${category!=='all'?'open':''}><summary id="filter-summary">基金策略 · ${category==='all'?'全部':categoryLabel(category)}</summary><div class="chips" id="filter-chips"></div></details><div class="filter-reset-row"><span id="active-filters"></span><button class="text-button" data-action="reset-filters" id="reset-filters">清除搜尋與篩選</button></div><div class="list-controls"><span id="list-count" role="status" aria-live="polite"></span><label>排序 <select id="sort"><option value="code">代碼</option><option value="name">名稱</option></select></label></div><div class="list-panel" id="results"></div><div class="inline-actions" id="pagination"></div>${sourceNote()}`;}
function fillResults(){const target=document.querySelector('#results');if(!target)return;const q=query.trim().toLowerCase();const filtered=records().filter(e=>(category==='all'||e.category===category)&&(roleFilter==='all'||(e.roleAssessment?.role||'pending')===roleFilter)&&`${e.code} ${e.name}`.toLowerCase().includes(q)).sort((a,b)=>String(a[sort]).localeCompare(String(b[sort]),'zh-TW'));const pages=Math.max(1,Math.ceil(filtered.length/10));listPage=Math.min(listPage,pages);document.querySelector('#filter-chips').innerHTML=[{id:'all',label:'全部'},...CATEGORIES].map(c=>`<button class="chip ${c.id===category?'selected':''}" data-action="filter" data-category="${c.id}" aria-pressed="${c.id===category}">${c.label}</button>`).join('');const roleButton=(id,label,description='')=>`<button class="${description?'role-option':'chip'} ${id===roleFilter?'selected':''}" data-action="role-filter" data-role="${id}" aria-pressed="${id===roleFilter}"><b>${label}</b>${description?`<small>${description}</small>`:''}</button>`;document.querySelector('#role-chips').innerHTML=`<div class="role-utility">${roleButton('all','全部 ETF')}${roleButton('pending','待核驗')}</div><div class="role-options">${roleButton('piggyBank','存錢筒','長期累積')}${roleButton('printer','印鈔機','穩定獲利候選')}${roleButton('slotMachine','老虎機','高波動・高風險')}</div>`;document.querySelector('#filter-summary').textContent='基金策略 · '+(category==='all'?'全部':categoryLabel(category));document.querySelector('#active-filters').textContent=[roleFilter==='all'?'':ROLE_LABELS[roleFilter],category==='all'?'':categoryLabel(category)].filter(Boolean).join(' ＋ ');document.querySelector('#reset-filters').hidden=!query&&roleFilter==='all'&&category==='all';document.querySelector('#sort').value=sort;document.querySelector('#list-count').textContent=catalog?`${filtered.length} 檔 · 第 ${listPage}／${pages} 頁`:'名單載入中';target.innerHTML=!catalog?'<div class="loading">等待官方名單…</div>':filtered.length?filtered.slice((listPage-1)*10,listPage*10).map(etfRow).join(''):empty('沒有符合的 ETF','搜尋、投資角色與基金策略會一起篩選。',button('清除搜尋與篩選','reset-filters'));document.querySelector('#pagination').innerHTML=pages>1?`${button('上一頁','prev-page',false,listPage<=1?'disabled':'')}${button('下一頁','next-page',false,listPage>=pages?'disabled':'')}`:'';quote.routeChanged();}
function holdings(){const s=portfolioSummary(store(),records());return `${title('我的持有',false,button(icon('plus')+' 新增持有','add-holding',true,'aria-label="新增持有"'))}<div class="segmented"><button data-action="holding-tab" data-tab="holdings" class="${holdingTab==='holdings'?'selected':''}">持有部位</button><button data-action="holding-tab" data-tab="allocation" class="${holdingTab==='allocation'?'selected':''}">成本配置</button></div>${totalCard(true)}${holdingTab==='allocation'?`<section class="card"><h2>錢分配在哪些類型？</h2>${allocation(s)}</section>`:`<section class="card">${store().holdings.length?store().holdings.map(h=>`<article class="holding-row"><div><a href="#etf/${esc(h.code)}"><div class="code">${esc(h.code)}</div><div class="etf-name">${esc(h.name)}</div></a><div class="small" data-money>${money(h.shares)} 股 · 總成本 ${money(h.cost)}</div><div class="tiny">${h.priceDate?esc(h.priceDate)+' 自填參考價':'尚未填寫參考價'}</div><button class="button smallbtn" data-action="edit-holding" data-id="${esc(h.id)}" style="margin-top:9px">編輯</button></div><div class="right"><b data-money>${h.price===null?'—':money(h.shares*h.price)}</b><p class="small ${h.price===null?'':tone(h.shares*h.price-h.cost)}" data-money>${h.price===null?'尚無估值':signed(h.shares*h.price-h.cost)+' 元'}</p><span class="tiny">參考市值／未實現損益</span></div></article>`).join(''):empty('還沒有持有紀錄','新增一檔，你的資產就會開始出現在這裡。')}</section>`}<div class="inline-actions">${button(icon('plus')+' 新增持有','add-holding',true)}<a class="button" href="#tools/portfolio">管理／刪除／匯出</a></div><div class="data-note">目前是持倉快照，非買賣流水帳。已實現損益與歷史績效未計算。</div>`;}
function calendar(){const monthStr=`${calYear}-${String(calMonth).padStart(2,'0')}`;const entries=store().dividends.filter(d=>d.paymentDate.startsWith(monthStr));const shown=calendarTab==='history'?store().dividends.filter(d=>d.status==='received').sort((a,b)=>b.paymentDate.localeCompare(a.paymentDate)):entries.filter(d=>d.paymentDate===selectedDay);const received=entries.filter(d=>d.status==='received').reduce((a,d)=>a+dividendAmount(d),0);return `${title('股息月曆',false,`<a class="button primary smallbtn" href="#tools/dividends" aria-label="新增股息紀錄">${icon('plus')} 記錄股息</a>`)}<div class="segmented"><button data-action="calendar-tab" data-tab="calendar" class="${calendarTab==='calendar'?'selected':''}">入帳月曆</button><button data-action="calendar-tab" data-tab="history" class="${calendarTab==='history'?'selected':''}">已領紀錄</button></div><a class="context-link" href="#notifications">${icon('bell')} 配息提醒${icon('arrow')}</a>${calendarTab==='calendar'?`<section class="card"><div class="calendar-head"><button class="iconbtn" data-action="prev-month" aria-label="上個月" ${calYear===1900&&calMonth===1?'disabled':''}>${icon('back')}</button><h2>${calYear} 年 ${calMonth} 月</h2><button class="iconbtn" data-action="next-month" aria-label="下個月" ${calYear===2200&&calMonth===12?'disabled':''}>${icon('arrow')}</button></div><div class="calendar-grid">${['日','一','二','三','四','五','六'].map(d=>`<div class="weekday">${d}</div>`).join('')}${calendarCells(calYear,calMonth).map(d=>d?`<button class="day ${d===selectedDay?'selected':''} ${d===today?'today':''}" data-action="day" data-date="${d}" aria-label="${d}" aria-pressed="${d===selectedDay}">${Number(d.slice(-2))}<span class="dots">${[...new Set(entries.filter(e=>e.paymentDate===d).map(e=>e.status))].map(s=>`<i class="dot ${s}"></i>`).join('')}</span></button>`:'<span></span>').join('')}</div><div class="legend"><span><i class="dot"></i>已入帳</span><span><i class="dot announced"></i>公告・自行登錄</span><span><i class="dot planned"></i>自行預估</span></div><div class="cash-line" style="margin-top:10px"><span class="small">本月實際已領</span><strong data-money>${money(received)} 元</strong></div></section>`:''}<div class="section-head"><h2>${calendarTab==='history'?'實收股息紀錄':esc(selectedDay)}</h2><a href="#tools/dividends">管理紀錄 ${icon('arrow')}</a></div>${shown.length?shown.map(d=>`<a class="calendar-event" style="display:block" href="#tools/dividends"><b>${esc(d.code)} ${esc(d.name)}</b><p>${esc(d.paymentDate)} · ${d.status==='received'?'實際入帳':d.status==='announced'?'已公告・自行登錄':'自行預估'} <strong data-money>${money(dividendAmount(d))} 元</strong></p>${d.exDate?`<p>除息日 ${esc(d.exDate)}</p>`:''}</a>`).join(''):empty(calendarTab==='history'?'還沒有實收紀錄':'這天沒有已登錄的入帳','這不代表市場沒有配息；本版由你登錄配息資訊。',`<a class="button primary" href="#tools/dividends">${icon('plus')} 記錄股息</a>`)}<p class="data-note">以「入帳日」安排現金流，除息日另外標示。公告尚未自動同步。</p>`;}
function detail(code){const e=records().find(e=>e.code===code);if(!e)return `${title(code||'ETF 詳情')}${empty(catalog?'此代碼未在目前資料範圍':'正在載入 ETF 名單','已保存的持有不會因此被刪除。',`<a class="button" href="#list">回探索</a>`)}${sourceNote()}`;const dv=store().dividends.filter(d=>d.code===code);return `${title(esc(e.code),true,`<button class="button smallbtn ${favorites.includes(code)?'on':''}" data-action="favorite" data-code="${code}" aria-label="${favorites.includes(code)?'取消收藏':'收藏'} ${code}" aria-pressed="${favorites.includes(code)}">${icon('star')} ${favorites.includes(code)?'已收藏':'收藏'}</button>`,'list','返回找 ETF')}<div class="detail-hero"><h2>${esc(e.name)}</h2><p class="small">${categoryLabel(e.category)} · ${e.management==='active'?'主動管理':'追蹤指數'}</p><div class="quote-slot" data-quote="${code}"></div></div><div class="inline-actions">${button(icon('plus')+' 記錄持有','add-holding',true,`data-code="${code}"`)}${button(icon('compare')+(comparison.includes(code)?' 已加入比較':' 加入比較'),'compare',false,`data-code="${code}"`)}</div><div class="segmented">${[['overview','總覽'],['components','成分股'],['dividend','配息'],['info','基金資訊']].map(([v,t])=>`<button data-action="detail-tab" data-tab="${v}" class="${detailTab===v?'selected':''}">${t}</button>`).join('')}</div>${detailTab==='overview'?rolePanel(e):''}${detailTab==='overview'?`<section class="card"><h3>價格與績效</h3><div class="chart-empty">${icon('chart')}<p>歷史走勢資料尚未接入</p><small>不以示意線條代替真實績效。</small></div><div class="details-grid"><div class="detail-field"><span>管理方式</span>${e.management==='active'?'主動式':'被動式'}</div><div class="detail-field"><span>上市日期</span>${esc(e.listingDate||'待確認')}</div><div class="detail-field"><span>淨值／折溢價</span>尚未接入</div><div class="detail-field"><span>基金費用率</span>尚未接入</div></div></section>`:detailTab==='components'?constituentsPanel(code):detailTab==='dividend'?`<section class="card"><h3>這檔 ETF 的配息記錄</h3>${dv.length?cashRows(dv.sort((a,b)=>b.paymentDate.localeCompare(a.paymentDate)),20):empty('還沒有配息紀錄','這裡顯示你自行登錄的股息，不是官方配息歷史。',`<a class="button" href="#tools/dividends">記錄股息</a>`)}</section>`:`<section class="card"><h3>官方基本資料</h3><p class="small" style="margin-top:12px">${esc(e.fullName||e.name)}</p><div class="detail-field" style="margin:14px 0"><span>追蹤指數</span>${esc(e.index||'不適用／未提供')}</div><div class="detail-field"><span>分類依據（App 規則）</span>${esc(e.classificationBasis||'待分類')}</div><p class="data-note">資料日期 ${esc(e.sourceDate||catalog.sourceDate)}</p><a class="button" target="_blank" rel="noopener noreferrer" href="https://www.twse.com.tw/zh/products/securities/etf/products/list.html">官方查證 ${icon('arrow')}</a></section>`}<p class="data-note">行情依個人連線提供；配息與歷史績效資料尚未同步。以上不構成買賣建議。</p>`;}
function compareOverlapPanel(){
 const codes=comparison.slice(0,3),available=codes.filter(code=>constituentData.has(code)),missing=codes.filter(code=>!constituentData.has(code));
 if(codes.length<2)return '';
 const holdings=new Map();
 for(const code of available){for(const item of constituentData.get(code).components){let x=holdings.get(item.symbol);if(!x){x={name:item.name,codes:[],weights:[]};holdings.set(item.symbol,x);}x.codes.push(code);x.weights.push(item.weight);}}
 const common=[...holdings.entries()].filter(([symbol,row])=>row.codes.length>1).sort((a,b)=>Math.min(...b[1].weights)-Math.min(...a[1].weights));
 const hint=missing.length?`<div class="info-box">目前缺少 ${missing.map(esc).join('、')} 的成分股資料，只能對已取得資料的 ETF 進行部分比較。未取得完整資料前，不會顯示「零重疊」或估算全部風險。</div>`:'';
 return `<section class="card"><div class="cardhead"><h2>持股重疊透視</h2><span class="feature-badge">ETF 實際持股</span></div><p class="small" style="margin:12px 0">同一家股票是否同時出現在不同 ETF？依成分股公告日期比較，非盤中即時持股。</p>${hint}${common.length?`<div class="constituent-list">${common.slice(0,20).map(([symbol,row])=>`<div class="constituent-row"><div><b>${esc(row.name)}</b><small>${esc(symbol)} · ${row.codes.map((c,i)=>esc(c)+' '+row.weights[i].toFixed(2)+'%').join('／')}</small></div><strong>${row.codes.length} 檔重疊</strong></div>`).join('')}</div>`:missing.length?'':`<div class="info-box">可用成分股中未發現相同股票；仍須以各檔公告完整性為準。</div>`}<div class="inline-actions">${codes.map(c=>`<a href="#etf/${esc(c)}/components" class="button">${esc(c)} 成分股</a>`).join('')}</div></section>`;
}
function compareBase(){const rows=comparison.map(code=>records().find(e=>e.code===code)||{code,name:'尚未載入／不在本次資料範圍',category:'pending',management:null,index:null});return `${title('ETF 比較',true,'','list','返回找 ETF')}<p class="small">最多三檔，一次看清基本差異。</p>${rows.length?`<div class="table-wrap"><table><thead><tr><th>比較項目</th>${rows.map(e=>`<th><a href="#etf/${e.code}" class="code">${e.code}</a><div class="etf-name">${esc(e.name)}</div><button class="button smallbtn" data-action="compare" data-code="${e.code}">移除</button></th>`).join('')}</tr></thead><tbody><tr><th>目前報價</th>${rows.map(e=>`<td class="quote-slot" data-quote="${e.code}"></td>`).join('')}</tr>${[['主要分類',e=>categoryLabel(e.category)],['管理方式',e=>e.management==='active'?'主動式':e.management==='passive'?'被動式':'待確認'],['追蹤指數',e=>e.index||'不適用／未提供'],['資料日期',e=>e.sourceDate||'待確認'],['配息／費用率',()=> '尚未接入']].map(([label,get])=>`<tr><th>${label}</th>${rows.map(e=>`<td>${esc(get(e))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="inline-actions"><a class="button primary" href="#list">挑選其他 ETF</a>${button('清空比較','clear-compare')}</div>`:empty('先挑兩檔，看看差在哪','進入 ETF 詳情，點「加入比較」。',`<a class="button primary" href="#list">探索 ETF</a>`)}${compareOverlapPanel()}${sourceNote()}`;}
function overlapMarkup(){const selected=comparison.filter(c=>constituentData.has(c));if(comparison.length<2)return '';if(selected.length<2)return `<section class="card"><h2>重疊成分股</h2><div class="info-box">請先取得至少兩檔 ETF 的真實成分股資料，再進行交集分析。不會用猜測的名單補齊。</div></section>`;const maps=selected.map(c=>new Map(constituentData.get(c).components.map(x=>[x.symbol,x]))),same=[...maps[0]].filter(([sym])=>maps.slice(1).every(m=>m.has(sym))).sort((a,b)=>b[1].weight-a[1].weight);return `<section class="card"><h2>共同成分股</h2><p class="small">已取得成分股資料的 ETF：${selected.join('、')}；不同 ETF 公告日期可能不同。</p>${same.length?same.slice(0,40).map(([sym,x],i)=>`<div class="constituent-row"><span><b>${i+1}. ${esc(x.name)}</b><small>${esc(sym)} · ${selected.map((c,j)=>c+' '+maps[j].get(sym).weight.toFixed(2)+'%').join('／')}</small></span><strong>${selected.length} 檔</strong></div>`).join(''):'<p class="small">目前已取得資料中沒有共同股票。</p>'}</section>`;}
function compare(){return compareBase()+overlapMarkup();}
function favoritesPage(){const rows=favorites.map(code=>records().find(e=>e.code===code)||{code,name:'尚未載入／不在本次資料範圍',category:'pending',management:null});return `${title('我的收藏',true,'','list','返回找 ETF')}<p class="small" style="margin-bottom:15px">${favorites.length} 檔自選，不代表實際持有。</p><div class="list-panel">${rows.length?rows.map(etfRow).join(''):empty('先收藏，慢慢了解','點 ETF 旁邊的星星，即可加入這裡。',`<a class="button" href="#list">探索 ETF</a>`)}</div>`;}
function notifications(){const s=portfolioSummary(store(),records());return `${title('提醒中心',true,'','calendar','返回股息月曆')}<section class="card"><div class="cardhead"><h2>需要你確認</h2><span class="pill">${s.overdue.length} 筆</span></div>${s.overdue.length?cashRows(s.overdue,30):empty('目前沒有逾期未確認紀錄','新登錄的股息會依預定入帳日期出現在這裡。')}</section><section class="card"><h2>接下來的股息</h2>${s.upcoming.length?cashRows(s.upcoming,30):'<p class="small" style="margin-top:12px">尚無已登錄的待入帳股息。</p>'}</section><div class="notice">這是 App 內的紀錄提醒，尚未啟用背景推播、到價、Email 或 LINE 通知。日期到了不會自動標成已領。</div>`;}
function moreLink(i,t,d,href,action=''){return `<${action?'button':'a'} class="more-link" ${action?`data-action="${action}"`:`href="#${href}"`}><span class="rowicon">${icon(i)}</span><span class="text"><b>${t}</b><small>${d}</small></span>${icon('arrow')}</${action?'button':'a'}>`;}
function more(){return `${title('更多',false)}<p class="page-intro">試算、研究與資料管理，都在這裡。</p><div class="menu-groups"><section class="card menu-group"><h2>試算與研究</h2>${moreLink('calc','股息複利','比較股息領出、部分投入、全部再投入','tools/compound')}${moreLink('chart','領息目標','算出領息目標需要多少本金','tools/goal')}${moreLink('compare','ETF 比較','最多三檔並排比較，也可看成分股重疊','compare')}${moreLink('chart','我的持股透視','看看 ETF 背後有哪些股票','insights')}</section><section class="card menu-group"><h2>我的紀錄</h2>${moreLink('wallet','持有完整管理','新增、編輯、刪除與匯出持有','tools/portfolio')}${moreLink('calendar','配息完整管理','新增、確認入帳與匯出股息紀錄','tools/dividends')}${moreLink('star','我的收藏','追蹤想了解的 ETF','favorites')}${moreLink('bell','配息提醒','查看已到期與接下來的入帳紀錄','notifications')}${moreLink('wallet','我的券商','查看整合進度與資料安全狀態','brokers')}</section><section class="card menu-group"><h2>備份與設定</h2>${moreLink('download','匯出完整備份','保存持有、配息、收藏與比較；不含行情金鑰','','backup')}${moreLink('upload','匯入備份','還原已有的備份檔；匯入前會請你確認','','import-backup')}${moreLink('link','行情連線','使用個人 Fugle 金鑰查看行情','','connect-quotes')}${moreLink('moon','深色模式','切換深色／淺色外觀','','theme')}${moreLink('info','資料來源與隱私','查看資料範圍、風險與版本','about')}</section></div><p class="data-note">跨券商自動同步尚未接通；成分股查詢依你的資料方案授權提供，不以假資料補齊。</p><p class="version">ETF 袋著走 · ${VERSION}<br>把你的 ETF，都袋著走。</p>`;}
function about(){return `${title('資料與隱私')}<section class="card"><h2>你的資料留在這台裝置</h2><p class="small" style="margin:12px 0">持有股數、成本、股息與收藏保存在這個瀏覽器。沒有雲端同步，清除網站資料會遺失；請定期匯出完整備份。</p><h3>行情金鑰</h3><p class="small" style="margin:10px 0">個人行情金鑰只在伺服器記憶體暫存，最長六小時，不存入瀏覽器、原始碼或備份；到期或伺服器重啟後需重新連接。App 查詢時會傳送所需證券代碼。</p><h3>資產與股息</h3><p class="small" style="margin:10px 0">持倉市值使用自行填入的參考價，不等於完整總資產；未填價格的部位不當作零。損益不含股息、不含已實現買賣成果。已領股息另外記錄，避免重複加總。</p><h3>名單與分類</h3>${sourceNote()}<p class="small">策略標籤為 App 規則，不能拿來判定適合買進。收益、配息與本金皆不保證；試算僅為自訂情境。</p></section><section class="card"><h3>目前尚未接入</h3><p class="small" style="margin-top:10px">官方配息自動同步、歷史走勢、基金費用率、盤中淨值、跨券商自動同步、雲端同步及背景推播。成分股需來源授權或由使用者匯入。介面不使用假數字或假線圖補齊。</p></section><p class="version">獨立開發版 ${VERSION} · 不使用 Lovable</p>`;}
function renderNav(view,arg=''){const active=['etf','favorites','compare'].includes(view)?'list':view==='notifications'?'calendar':view==='tools'?(arg==='portfolio'?'holdings':arg==='dividends'?'calendar':'more'):['about','insights','brokers'].includes(view)?'more':view;const alerts=portfolioSummary(store(),records()).overdue.length;document.querySelector('#nav').innerHTML=[['home','home','首頁'],['list','search','找 ETF'],['holdings','wallet','持有'],['calendar','calendar','配息'],['more','more','更多']].map(([id,i,t])=>`<a href="#${id}" class="${active===id?'current':''}" ${active===id?'aria-current="page"':''}>${icon(i)}<span>${t}</span>${id==='calendar'&&alerts?'<i class="nav-dot"></i>':''}</a>`).join('');const reminder=document.querySelector('#notification-link');reminder.classList.toggle('has-alerts',alerts>0);reminder.setAttribute('aria-label',alerts?`提醒中心，${alerts} 筆待確認`:'提醒中心');const tray=document.querySelector('#compare-tray');tray.hidden=!(comparison.length&&['list','favorites','etf'].includes(view));tray.innerHTML=tray.hidden?'':`<span><b>比較清單 ${comparison.length}／3</b><small>${comparison.join(' ／ ')}</small></span><a class="button smallbtn" href="#compare">開始比較 ${icon('arrow')}</a>`;document.body.classList.toggle('has-compare-tray',!tray.hidden);}
function route(){today=taipeiDate();const [view='home',arg='',subview='']=location.hash.replace(/^#\/?/,'').split('/');if(view==='etf'&&['overview','components','dividend','info'].includes(subview))detailTab=subview;main.hidden=view==='tools';toolsPanel.hidden=view!=='tools';if(view==='tools'){tools.tab=['compound','goal','portfolio','dividends'].includes(arg)?arg:'compound';tools.render();syncToolContext();renderNav(view,arg);document.body.classList.remove('home-view');return;}if(view==='holdings'&&arg==='allocation')holdingTab='allocation';if(view==='calendar'&&/^\d{4}-\d{2}-\d{2}$/.test(arg)){const d=new Date(arg+'T00:00:00Z');if(Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===arg&&arg>='1900-01-01'&&arg<='2200-12-31'){selectedDay=arg;calYear=Number(arg.slice(0,4));calMonth=Number(arg.slice(5,7));}}if(view==='list'&&arg)category=CATEGORIES.some(c=>c.id===arg)?arg:'all';main.innerHTML=view==='list'?list():view==='holdings'?holdings():view==='calendar'?calendar():view==='etf'?detail(arg):view==='favorites'?favoritesPage():view==='compare'?compare():view==='notifications'?notifications():view==='more'?more():view==='about'?about():view==='insights'?insightPage():view==='brokers'?brokerPage():home();if(view==='list')fillResults();renderNav(view,arg);document.documentElement.classList.toggle('privacy-hidden',hideMoney);document.body.classList.toggle('home-view',view==='home');if(storeBlocked||tools.blocked)main.insertAdjacentHTML('afterbegin','<div class="error-banner">本機資料無法完整讀取，既有資料未覆寫。請先備份或檢查瀏覽器儲存權限。</div>');quote.routeChanged();}
async function loadCatalog(){catalogError='';try{const r=await fetch('/api/catalog',{cache:'no-store',signal:AbortSignal.timeout(28000)});if(!r.ok)throw Error('官方名單暫時無法連線，請稍後重試。');const next=catalogData(await r.json());if(catalog&&next.sourceDate<catalog.sourceDate)throw Error('來源日期較舊，保留原名單。');catalog=next;catalogError='';}catch(e){catalogError=e.message;if(catalog)catalog.stale=true;}if(toolsPanel.hidden)route();}
// Guided holding entry. Uses the established version-2 record schema.
const holdingDialog=document.querySelector('#holding-dialog');let holdingStep=1,chosen=null,editingId=null;
function showHolding(code,id){editingId=id||null;const old=id?store().holdings.find(h=>h.id===id):null;chosen=old||records().find(e=>e.code===code)||null;holdingStep=chosen?2:1;renderHolding();holdingDialog.showModal();}
function holdingChoices(q=''){const target=holdingDialog.querySelector('#choose-results');if(!target)return;const rows=records().filter(e=>(e.code+' '+e.name).toLowerCase().includes(q.trim().toLowerCase())).slice(0,10);target.innerHTML=rows.length?rows.map(e=>`<button class="choose-etf" data-action="choose-etf" data-code="${e.code}"><span><b>${e.code}</b> ${esc(e.name)}</span>${icon('arrow')}</button>`).join(''):'<p class="small">名單暫不可用或未收錄，仍可手動輸入。</p>';}
function renderHolding(){const old=editingId?store().holdings.find(h=>h.id===editingId):null;holdingDialog.innerHTML=`<div class="modal-head"><h2>${editingId?'編輯持有':'新增我的持有'}</h2><button class="iconbtn" data-action="close-holding" aria-label="關閉">${icon('close')}</button></div><div class="step-label">${holdingStep===1?'步驟 1／2 · 選擇 ETF':'步驟 2／2 · 填股數與總成本'}</div>${holdingStep===1?`<p class="small">先選一檔，不需要知道所有投資名詞。</p><label class="searchbox">${icon('search')}<input id="choose-search" type="search" aria-label="搜尋要新增的 ETF" placeholder="搜尋代碼或名稱"></label><div class="choose-list" id="choose-results"></div><button class="button full" data-action="manual-etf" style="margin-top:14px">手動輸入代碼與名稱</button>`:`<form id="guided-holding"><div class="form-grid"><label class="field"><span>ETF 代碼</span><input name="code" required maxlength="20" value="${esc(chosen?.code||'')}" placeholder="0050"></label><label class="field"><span>ETF 名稱</span><input name="name" required maxlength="120" value="${esc(chosen?.name||'')}"></label><label class="field"><span>持有數量</span><input name="shares" type="number" inputmode="decimal" required min="0.001" step="any" value="${old?.shares||''}" placeholder="1000"></label><label class="field"><span>數量單位</span><select name="unit"><option value="shares">股</option><option value="lots">張（1,000 股）</option></select></label><label class="field full"><span>目前持倉總成本（元）</span><input name="cost" type="number" inputmode="decimal" required min="0" step="any" value="${old?.cost??''}" placeholder="填入實際支付金額，含費用"><small>填目前這檔 ETF 的全部持有成本，包含手續費；不是每股價格。</small></label></div><details><summary class="small" style="cursor:pointer;min-height:40px">選填：參考價格與日期（用來估算損益）</summary><div class="form-grid"><label class="field"><span>每股參考價格（折合台幣）</span><input name="price" type="number" min="0" step="any" inputmode="decimal" value="${old?.price??''}"></label><label class="field"><span>價格日期</span><input name="priceDate" type="date" value="${old?.priceDate||today}"></label></div><p class="tiny">外幣 ETF 請先換算成台幣再填入，避免跨幣別相加。這是自填估值，非即時行情。</p></details><p class="form-error" role="alert"></p><div class="inline-actions">${!editingId?button('上一步','holding-back'):''}<button class="button primary" type="submit">${icon('check')} 儲存持有</button></div></form>`}`;if(holdingStep===1)holdingChoices();}
holdingDialog.addEventListener('submit',e=>{if(e.target.id!=='guided-holding')return;e.preventDefault();try{const values=Object.fromEntries(new FormData(e.target));const h=validateHolding(holdingFromForm(values,editingId||crypto.randomUUID()));const previous=tools.data;tools.data={...previous,holdings:editingId?previous.holdings.map(x=>x.id===editingId?h:x):[...previous.holdings,h]};validateBackup(tools.data);const saved=tools.persist();holdingDialog.close();location.hash='#holdings';route();notify(saved?'持有已儲存。':'目前僅暫存，請立即匯出備份。');}catch(err){e.target.querySelector('.form-error').textContent=err.message;}});
const connectionDialog=document.querySelector('#connection-dialog');function showConnection(){document.querySelector('#disconnect-quotes').hidden=!quote.isConnected();connectionDialog.showModal();}
connectionDialog.addEventListener('close',()=>{document.querySelector('#api-key').value='';document.querySelector('#personal-consent').checked=false;document.querySelector('#connection-error').textContent='';});
document.querySelector('#connection-form').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');const key=document.querySelector('#api-key').value.trim();document.querySelector('#connection-error').textContent='';btn.disabled=true;btn.textContent='驗證中…';try{await quote.connect(key);document.querySelector('#api-key').value='';connectionDialog.close();notify('行情金鑰已驗證，正在查詢報價。');}catch(err){document.querySelector('#connection-error').textContent=err.message;}finally{btn.disabled=false;btn.textContent='驗證並連接';}});
function download(name,value){const u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function backup(){if(tools.blocked||storeBlocked){const raw={type:'ETF_RAW_RECOVERY',warning:'原始儲存快照，須人工修復；不能直接當正常備份匯入',raw:{}};try{for(const k of [STORE_KEY,'etf:favorites','etf:compare'])raw.raw[k]=localStorage.getItem(k);download('ETF_recovery_'+today+'.json',raw);notify('已匯出原始資料快照，未覆寫。');}catch{notify('瀏覽器拒絕存取儲存空間。');}return;}download('ETF_backup_'+today+'.json',{app:'ETF_CLASSIFIER',version:3,exportedAt:new Date().toISOString(),planning:validateBackup(store()),favorites,comparison});notify('備份不含行情金鑰，請確認檔案已儲存。');}
document.querySelector('#backup-input').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5000000)throw Error('備份不可超過 5MB。');const raw=JSON.parse(await f.text());let planning,fav=favorites,cmp=comparison;if(raw.app==='ETF_CLASSIFIER'&&raw.version===3){planning=validateBackup(raw.planning);if(!Array.isArray(raw.favorites)||!Array.isArray(raw.comparison))throw Error('備份格式不完整。');fav=validCodes(raw.favorites);cmp=validCodes(raw.comparison).slice(0,3);}else{planning=parseBackup(JSON.stringify(raw));}if(!confirm(`匯入 ${planning.holdings.length} 筆持有、${planning.dividends.length} 筆配息？這會取代目前記錄，建議先匯出備份。`))return;const keys=[STORE_KEY,'etf:favorites','etf:compare'],old=keys.map(k=>localStorage.getItem(k));try{localStorage.setItem(STORE_KEY,JSON.stringify(planning));localStorage.setItem(keys[1],JSON.stringify(fav));localStorage.setItem(keys[2],JSON.stringify(cmp));}catch(error){for(let i=0;i<keys.length;i++){try{old[i]===null?localStorage.removeItem(keys[i]):localStorage.setItem(keys[i],old[i]);}catch{}}throw Error('儲存失敗，已嘗試還原原資料，請保留備份檔。');}tools.data=planning;tools.blocked=false;tools.warning='';storeBlocked=false;favorites=fav;comparison=cmp;route();notify('備份已匯入。');}catch(err){notify(err.message);}finally{e.target.value='';}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const {action,code,id}=b.dataset;
 if(action==='theme')toggleTheme();else if(action==='privacy'){hideMoney=!hideMoney;document.documentElement.classList.toggle('privacy-hidden',hideMoney);try{localStorage.setItem('etf:privacy',hideMoney?'hide':'show');}catch{}b.setAttribute('aria-pressed',String(hideMoney));}
 else if(action==='favorite'||action==='compare'){const isFav=action==='favorite',list=isFav?favorites:comparison;const removing=list.includes(code);if(!removing&&!records().some(e=>e.code===code)){notify('請先載入這檔 ETF 的名單資料。');return;}if(!isFav&&!removing&&list.length>=3){notify('最多比較三檔，請先移除一檔。');return;}const next=removing?list.filter(x=>x!==code):[...list,code];if(writeList(isFav?'etf:favorites':'etf:compare',next)){if(isFav)favorites=next;else comparison=next;route();notify(isFav?(removing?'已取消收藏':'已加入收藏'):(removing?'已移除比較':'已加入比較'));}}
 else if(action==='clear-compare'){if(writeList('etf:compare',[])){comparison=[];route();}}
 else if(action==='filter'){category=b.dataset.category;listPage=1;history.replaceState(null,'',category==='all'?'#list':`#list/${category}`);fillResults();}
 else if(action==='reset-filters'){query='';category='all';roleFilter='all';listPage=1;history.replaceState(null,'','#list');document.querySelector('#search').value='';fillResults();}
 else if(action==='prev-page'||action==='next-page'){listPage+=action==='prev-page'?-1:1;fillResults();main.scrollIntoView({behavior:'smooth'});}
 else if(action==='holding-tab'){holdingTab=b.dataset.tab;history.replaceState(null,'','#holdings');route();}else if(action==='calendar-tab'){calendarTab=b.dataset.tab;route();}else if(action==='detail-tab'){detailTab=b.dataset.tab;route();}
 else if(action==='prev-month'||action==='next-month'){const d=new Date(Date.UTC(calYear,calMonth-1+(action==='prev-month'?-1:1),1));calYear=d.getUTCFullYear();calMonth=d.getUTCMonth()+1;selectedDay=`${calYear}-${String(calMonth).padStart(2,'0')}-01`;history.replaceState(null,'','#calendar');route();}else if(action==='day'){selectedDay=b.dataset.date;history.replaceState(null,'','#calendar');route();}
 else if(action==='add-holding'||action==='edit-holding')showHolding(code,id);else if(action==='close-holding')holdingDialog.close();else if(action==='choose-etf'){chosen=records().find(x=>x.code===code);holdingStep=2;renderHolding();}else if(action==='manual-etf'){chosen=null;holdingStep=2;renderHolding();}else if(action==='holding-back'){holdingStep=1;renderHolding();}
 else if(action==='connect-quotes')showConnection();else if(action==='close-connection')connectionDialog.close();else if(action==='disconnect-quotes'){try{await quote.disconnect();connectionDialog.close();notify('已中斷行情連線。');}catch(err){notify(err.message);}}
 else if(action==='fetch-components')loadConstituents(code);else if(action==='role-filter'){roleFilter=b.dataset.role;listPage=1;fillResults();}else if(action==='reload-catalog')loadCatalog();else if(action==='backup')backup();else if(action==='import-backup')document.querySelector('#backup-input').click();
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;listPage=1;fillResults();}if(e.target.id==='choose-search')holdingChoices(e.target.value);});document.addEventListener('change',e=>{if(e.target.id==='sort'){sort=e.target.value==='name'?'name':'code';fillResults();}});
function syncToolContext(){const entry=tools.tab==='portfolio'?['holdings','返回我的持有']:tools.tab==='dividends'?['calendar','返回股息月曆']:['more','返回更多工具'];const link=document.querySelector('#tools-back');link.href='#'+entry[0];link.innerHTML=icon('back')+entry[1];}
tools.shadowRoot.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&['tab','record-dividend'].includes(b.dataset.action)){history.replaceState(null,'',`#tools/${tools.tab}`);syncToolContext();renderNav('tools',tools.tab);}});
window.addEventListener('hashchange',()=>{detailTab='overview';route();window.scrollTo({top:0,behavior:'instant'});});
window.addEventListener('storage',e=>{if(![STORE_KEY,'etf:favorites','etf:compare','etf:theme',null].includes(e.key))return;if(e.key===STORE_KEY||e.key===null){const s=readStorage(localStorage);if(!s.blocked)tools.data=s.data;tools.blocked=s.blocked;tools.warning=s.warning;}if(e.key==='etf:favorites'||e.key===null)favorites=loadCodes('etf:favorites');if(e.key==='etf:compare'||e.key===null)comparison=loadCodes('etf:compare').slice(0,3);if(e.key==='etf:theme')applyTheme(e.newValue==='dark');if(holdingDialog.open||connectionDialog.open){notify('另一個分頁更新了資料，請確認目前輸入。');return;}route();});
route();loadCatalog();quote.status().then(()=>quote.refresh());
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});

document.addEventListener('change',async e=>{const code=e.target?.dataset?.componentsImport;if(!code)return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>1000000)throw Error('成分股檔超過 1 MB 上限。');const data=JSON.parse(await file.text());if(data.symbol!==code||!/^\d{4}-\d{2}-\d{2}$/.test(data.date)||data.date>today)throw Error('ETF 代碼或資料日期不正確。');const clean=normalizeComponents(data.components);if(!clean)throw Error('成分股資料格式或權重無效。');const value={symbol:code,date:data.date,components:clean,source:'使用者匯入（未經本站核驗）'};const snapshot=JSON.parse(localStorage.getItem(ETF_HOLDING_CACHE_KEY)||'{}');snapshot[code]=value;const serialized=JSON.stringify(snapshot);if(serialized.length>500000)throw Error('本機成分股空間不足，請先匯出重要資料。');localStorage.setItem(ETF_HOLDING_CACHE_KEY,serialized);constituentData.set(code,value);constituentErrors.delete(code);route();notify('已匯入 '+code+' 成分股，標示為使用者資料。');}catch(err){notify(err.message||'匯入失敗，資料未覆寫。');}finally{e.target.value='';}});
