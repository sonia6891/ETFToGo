<title>ETF 袋著走</title>
<style>
/* Layout: one phone-width column (max 440px) with a sticky screen header, a scrolling body and a fixed iOS-style tab bar. Deliberately light-only, matching the native app. */
:root {
  --bg: #edf2ff; --bg-soft: #f6f8ff; --card: #ffffff; --ink: #0f1f3d; --muted: #66748f; --line: rgba(15,31,61,.09);

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; background: linear-gradient(180deg, #e3ecff 0%, var(--bg-soft) 420px); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.bold { font-weight: 700; }
.up { color: var(--red); } .down { color: var(--green); } .flat { color: var(--muted); }

/* Header */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; min-height: 52px; padding: 0 10px; background: color-mix(in srgb, var(--bg-soft) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

.legend-row { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
.legend-row span { display: inline-flex; align-items: center; gap: 4px; }
.legend-row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.div-row { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fff; border-radius: 14px; padding: 12px 12px 12px 16px; box-shadow: 0 3px 10px rgba(31,107,255,.06); overflow: hidden; }
.div-row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }

/* Tools */
.tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tool { background: #fff; border-radius: 20px; padding: 18px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: var(--shadow); text-align: center; }

<script>
"use strict";
/* ---------- formatting ---------- */
const $ = (s) => document.querySelector(s);
const nf0 = new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 2 });
const nfp = new Intl.NumberFormat("zh-TW", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (v) => nf0.format(Math.round(v) || 0);
const dec = (v) => nf2.format(v);
const priceText = (v) => nfp.format(v);
const signed = (v, f = money) => (v > 0 ? "+" : v < 0 ? "-" : "") + f(Math.abs(v));
const pct = (v) => signed(v, dec) + "%";
const trendCls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "flat");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => dayStr(new Date());
const md = (s) => { const d = parseDay(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const shown = (text) => (S.prefs.hidden ? "＊＊＊＊" : text);
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);

/* ---------- vocabulary shared with the iPhone app ---------- */
const STRATS = ["存錢筒", "印鈔機", "老虎機", "待分類"];
const STRAT = {
  "存錢筒": { emoji: "🐷", tag: "長期累積", color: "var(--pink)", exp: "追蹤大型權值或市值指數，成分股分散，適合長期定期投入累積。仍會隨股市漲跌波動。" },
  "印鈔機": { emoji: "🖨️", tag: "配息現金流", color: "var(--green)", exp: "名稱屬高股息／高息類型，著重配息現金流。配息可能來自收益或本金，配息率不等於報酬率。" },
  "老虎機": { emoji: "🎰", tag: "高風險機會", color: "var(--purple)", exp: "槓桿或反向型，每日重設、波動放大，較適合短期且需嚴格控管部位。" },

  const vs = points.map((p) => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  const padv = Math.max((hi - lo) * 0.12, Math.abs(hi) * 0.002, 0.01); const yLo = lo - padv, yHi = hi + padv;
  const t0 = points[0].t, t1 = points[points.length - 1].t;
  const x = (t) => ((t - t0) / ((t1 - t0) || 1)) * W;
  const y = (v) => top + (1 - (v - yLo) / (yHi - yLo)) * (H - top - bottom);
  const line = points.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  const fmt = o.money ? money : priceText;
  const axes = o.axes ? `<span class="axis-y" style="top:${top - 2}px">${fmt(hi)}</span><span class="axis-y" style="bottom:${bottom}px">${fmt(lo)}</span>` : "";
  const dates = o.axes ? `<div class="axis-x"><span>${dayStr(new Date(t0))}</span><span>${dayStr(new Date(t1))}</span></div>` : "";
  return `<div><div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="走勢圖，最低 ${fmt(lo)}，最高 ${fmt(hi)}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--blue);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--blue);stop-opacity:.02"/></linearGradient></defs><path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#${gid})"/><path d="${line}" fill="none" style="stroke:var(--blue)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>${axes}</div>${dates}</div>`;
}
function donut(slices) {
  const total = Math.max(sum(slices, (s) => s.amount), 1); let acc = 0;
  const arcs = slices.map((s) => { const p = s.amount / total * 100; const gap = slices.length > 1 ? 1.2 : 0; const c = `<circle cx="21" cy="21" r="15.915" fill="none" style="stroke:${STRAT[s.strategy].color}" stroke-width="7" stroke-dasharray="${Math.max(p - gap, 0.1)} ${100 - Math.max(p - gap, 0.1)}" stroke-dashoffset="${-acc}"/>`; acc += p; return c; }).join("");
  const legend = slices.map((s) => `<div class="row"><i style="background:${STRAT[s.strategy].color}"></i><span class="grow">${esc(s.strategy)}</span><b class="num">${dec(s.amount / total * 100)}%</b></div>`).join("");
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 42 42" role="img" aria-label="策略配置圓環圖">${arcs}</svg><div class="legend">${legend}</div></div>`;
}
const empty = (emoji, title, text) => `<div class="empty"><span class="em">${emoji}</span><b>${esc(title)}</b><span class="small">${esc(text)}</span></div>`;
const sectionHead = (title, right) => `<div class="section-head"><h2 class="section-title">${esc(title)}</h2>${right || ""}</div>`;
const toolRow = (title, sub, ic, act, extra) => `<button type="button" class="tool-row" data-act="${act}" ${extra || ""}><span class="ri">${icon(ic)}</span><span class="grow"><b>${esc(title)}</b><br><span class="small muted">${esc(sub)}</span></span><span class="chev">${icon("right")}</span></button>`;

}

function sortedHoldings() {

}

function readPlan() {
  const n = (id) => Number($("#" + id).value);
  return { principal: n("pl-principal"), monthly: n("pl-monthly"), years: Math.round(n("pl-years")), totalReturn: n("pl-ret"), distributionRate: n("pl-dist"), frequency: n("pl-freq"), reinvest: n("pl-reinvest"), deductionRate: n("pl-deduct") };
}
function planValid(p) { return isFinite(p.principal) && p.principal >= 0 && p.principal <= 1e12 && isFinite(p.monthly) && p.monthly >= 0 && p.monthly <= 1e9 && p.years >= 1 && p.years <= 50; }
function updatePlan() {
  if (!$("#plan-form")) return; const p = readPlan();
  ["ret", "dist", "reinvest", "deduct"].forEach((k) => { const el = $("#pl-" + k); $("#pl-" + k + "-v").textContent = dec(Number(el.value) * 100) + "%"; });
  if (!planValid(p)) { $("#plan-out").innerHTML = `<p class="error">輸入超出範圍，請檢查金額與年數（1–50 年）。</p>`; return; }
  const rows = planProject(p), last = rows[rows.length - 1];
  $("#plan-out").innerHTML = `<b>第 ${p.years} 年試算</b><div class="out" style="margin-top:6px"><div><span class="muted">累計投入</span><b class="num">$${money(last.contributed)}</b></div><div><span class="muted">投資部位</span><b class="num">$${money(last.invested)}</b></div><div><span class="muted">累計保留現金</span><b class="num">$${money(last.cash)}</b></div><div><span class="muted">合計資產</span><b class="num" style="color:var(--blue)">$${money(last.total)}</b></div></div>
    ${lineChart(rows.map((r) => ({ t: r.year, v: r.total })), { height: 90, money: true })}`;
}

  cat: (ds) => { const f = S.ui.filter; f.strategies = f.strategies.length === 1 && f.strategies[0] === ds.v ? [] : [ds.v]; renderScreen(); },
  unchip: (ds) => { const f = S.ui.filter; if (ds.k === "management") f.management = null; else f[ds.k] = f[ds.k].filter((x) => x !== ds.v); renderScreen(); },
  opt: (ds) => { const f = S.ui.filter; if (ds.k === "management") f.management = f.management === ds.v ? null : ds.v; else f[ds.k] = f[ds.k].includes(ds.v) ? f[ds.k].filter((x) => x !== ds.v) : f[ds.k].concat(ds.v); renderSheet(); renderScreen(); },
  clearFilter: () => { S.ui.filter = { strategies: [], management: null, markets: [], assets: [] }; renderSheet(); renderScreen(); },
  hSec: (ds) => { S.ui.hSection = Number(ds.i); renderScreen(); },
  hsearch: () => { S.ui.hSearch = !S.ui.hSearch; if (!S.ui.hSearch) S.ui.hq = ""; renderScreen(); if (S.ui.hSearch) { const el = $("#hq"); if (el) el.focus(); } },
  dSec: (ds) => { S.ui.dSection = Number(ds.i); renderScreen(); },
  month: (ds) => { const [y, m] = S.ui.month.split("-").map(Number); const n = new Date(y, m - 1 + Number(ds.v), 1); S.ui.month = `${n.getFullYear()}-${pad(n.getMonth() + 1)}`; S.ui.day = null; renderScreen(); },
  day: (ds) => { S.ui.day = S.ui.day === ds.v ? null : ds.v; renderScreen(); },
  cmpPair: (ds) => { S.ui.cmpPair = Number(ds.i); renderScreen(); },
  compare: (ds) => {
    const d = data(); const list = (d.comparison || []).slice();
    if (list.includes(ds.sym)) { toast(ds.sym + " 已在比較清單，可到「工具 › 三檔比較」查看。"); return; }
    if (list.length >= 3) list.shift(); list.push(ds.sym); d.comparison = list; commit(); toast("已加入比較：" + list.join("、"));
  },
  copy: (ds) => { const t = ds.text; const done = () => toast("已複製：" + t); try { navigator.clipboard.writeText(t).then(done, () => toast(t)); } catch (e) { toast(t); } },
  sheet: (ds) => openSheet(ds.sheet, { id: ds.id, sym: ds.sym }),
  close: () => closeSheet(),
  backdrop: (ds, el, e) => { if (e.target === el) closeSheet(); },
  askDelete: () => { S.ui.confirmDelete = true; renderSheet(); },
  cancelDelete: () => { S.ui.confirmDelete = false; renderSheet(); },
  saveHolding: (ds) => {
    const val = (id) => $("#" + id).value.trim();
    const symbol = val("h-symbol").toUpperCase(), name = val("h-name"), shares = Number(val("h-shares").replace(/,/g, "")), unitCost = Number(val("h-cost").replace(/,/g, "")), broker = val("h-broker"), strategy = val("h-strategy");
    if (!symbol || symbol.length > 20 || !name || name.length > 120 || !(shares > 0 && shares <= 1e10) || !(unitCost >= 0 && unitCost <= 1e9 && val("h-cost") !== "") || !broker || broker.length > 120) { $("#h-error").textContent = "請填寫代碼、名稱與券商，股數須大於 0，每股成本不可為負數。"; return; }
    const d = data(); const h = { id: ds.id || uid(), symbol, name, shares, unitCost, broker, strategy };
    const i = d.holdings.findIndex((x) => x.id === h.id); if (i >= 0) d.holdings[i] = h; else d.holdings.push(h);
    closeSheet(); commit(); toast(i >= 0 ? "已更新持有" : "已新增持有");
  },
  deleteHolding: (ds) => { const d = data(); d.holdings = d.holdings.filter((x) => x.id !== ds.id); closeSheet(); commit(); toast("已刪除這筆持有，配息紀錄保留。"); },
  saveDividend: () => {
    const symbol = $("#v-symbol").value.trim().toUpperCase(), amount = Number($("#v-amount").value), date = $("#v-date").value, status = $("#v-status").value;
    if (!symbol || !(amount > 0 && isFinite(amount)) || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { $("#v-error").textContent = "請輸入代碼、大於 0 的配息總額與日期。"; return; }
    data().dividends.push({ id: uid(), symbol, date, amount, status }); closeSheet(); commit(); toast("已記錄配息");
  },
  markPaid: (ds) => { const x = data().dividends.find((y) => y.id === ds.id); if (x) x.status = "已入帳"; closeSheet(); commit(); toast("已標記為已入帳"); },
  deleteDividend: (ds) => { const d = data(); d.dividends = d.dividends.filter((x) => x.id !== ds.id); closeSheet(); commit(); toast("已刪除配息紀錄"); },
  savePlan: () => { const p = readPlan(); if (!planValid(p)) { toast("輸入超出範圍，未儲存。"); return; } data().plan = p; commit(); toast(S.mode === "demo" ? "示範模式不會儲存；切換到我的資料後再儲存。" : "已儲存試算設定"); },
  saveGoal: () => { data().goal = { target: Math.max(Number($("#g-target").value) || 0, 0), yield: Number($("#g-yield").value) }; commit(); toast(S.mode === "demo" ? "示範模式不會儲存。" : "已儲存目標"); },
  mode: (ds) => { S.mode = ds.v; savePrefs(); renderScreen(); toast(S.mode === "demo" ? "已切換到示範資料" : "已切換到我的資料"); },
  modeSeg: (ds) => ACT.mode({ v: ds.i === "0" ? "demo" : "mine" }),
  askClear: () => { S.ui.confirmClear = true; renderScreen(); },
  cancelClear: () => { S.ui.confirmClear = false; renderScreen(); },
  clearMine: () => { S.mine = emptyData(); S.ui.confirmClear = false; persist(); renderScreen(); toast("已清除我的測試資料"); },
  copyExport: () => { const box = $("#export-box"); try { navigator.clipboard.writeText(box.value).then(() => toast("已複製備份 JSON"), () => { box.select(); toast("請長按選取後複製"); }); } catch (e) { box.select(); toast("請長按選取後複製"); } },
  importData: () => {
    const err = $("#import-err"); let raw;
    try { raw = JSON.parse($("#import-box").value); } catch (e) { err.textContent = "內容不是有效的 JSON，請貼上完整的匯出內容。"; return; }
    if (!raw || raw.schema !== 1 || !Array.isArray(raw.holdings) || !Array.isArray(raw.dividends)) { err.textContent = "格式不符，請使用這個網頁版匯出的內容。"; return; }
    const before = JSON.stringify(body(S.mine)); const incoming = emptyData(); const keep = S.mine; S.mine = incoming; applyMine(raw); const parsed = S.mine; S.mine = keep;
    parsed.holdings.forEach((h) => { const i = S.mine.holdings.findIndex((x) => x.id === h.id); if (i >= 0) S.mine.holdings[i] = h; else S.mine.holdings.push(h); });
    parsed.dividends.forEach((h) => { const i = S.mine.dividends.findIndex((x) => x.id === h.id); if (i >= 0) S.mine.dividends[i] = h; else S.mine.dividends.push(h); });
    parsed.favorites.forEach((s) => { if (!S.mine.favorites.includes(s)) S.mine.favorites.push(s); });
    if (parsed.comparison.length) S.mine.comparison = parsed.comparison;
    S.mode = "mine"; savePrefs(); persist(); renderScreen();
    toast(JSON.stringify(body(S.mine)) === before ? "沒有新的紀錄需要匯入" : `已匯入 ${parsed.holdings.length} 筆持有、${parsed.dividends.length} 筆配息`);
  },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== "backdrop") e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.ui.q = t.value; const list = $("#fund-list"); if (list) list.innerHTML = fundList(); return; }
  if (t.id === "hq") { S.ui.hq = t.value; const list = $("#hlist"); if (list) { const items = sortedHoldings(); list.innerHTML = items.length ? items.map(holdingRow).join("") : empty("🔍", "找不到符合的持有", "換個代號、名稱或券商試試。"); } return; }
  if (t.closest("#plan-form")) return updatePlan();
  if (t.closest("#calc-form")) return updateCalc();
  if (t.closest("#goal-form")) return updateGoal();
  if (t.id === "h-symbol") {
    const f = fund(t.value.trim().toUpperCase()); if (!f) return;
    const name = $("#h-name"); if (!name.value || name.dataset.auto === "1") { name.value = f.name; name.dataset.auto = "1"; }
    $("#h-strategy").value = f.strategy;
  }
  if (t.closest("#holding-form")) {
    const s = Number($("#h-shares").value), c = Number($("#h-cost").value), box = $("#h-preview");
    if (s > 0 && c > 0) { box.hidden = false; box.innerHTML = `<div class="row"><span class="grow muted">這筆投入成本</span><b class="num">$${money(s * c)}</b></div>`; } else box.hidden = true;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "hsort") { S.ui.hSort = t.value; renderScreen(); }
  if (/^cmp\d$/.test(t.id)) { const d = data(); const syms = comparisonSymbols(d); syms[Number(t.dataset.i)] = t.value; d.comparison = syms; commit(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) closeSheet(); if (e.key === "Enter" && e.target.id === "q") e.target.blur(); });

/* ---------- boot ---------- */
const hadMode = loadPrefs();
renderScreen();
loadCatalog();
initStore(hadMode);
</script>
